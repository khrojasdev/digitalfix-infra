# Formacion de cluster por configuracion estatica: cada nodo conoce de
# antemano a los dos miembros y se une al arrancar. Requiere que todos los
# nodos compartan el mismo Erlang cookie (RABBITMQ_ERLANG_COOKIE).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Ante una particion de red, los nodos se reconcilian automaticamente.
cluster_partition_handling = autoheal

# Permite que el usuario guest se conecte desde otros contenedores (por
# defecto solo podria hacerlo desde localhost).
loopback_users.guest = false
