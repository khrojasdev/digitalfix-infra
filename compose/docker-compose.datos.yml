# DigitalFix - capa de datos para desarrollo local.
#
# Por ahora solo Oracle XE. RabbitMQ, Kafka y Zookeeper quedan declarados mas
# abajo pero comentados: se activan en la fase de notificaciones (F3), para no
# gastar memoria en un equipo de desarrollo mientras todavia no se usan.
#
#   docker compose -f compose/docker-compose.datos.yml up -d
#   docker compose -f compose/docker-compose.datos.yml ps
#   docker compose -f compose/docker-compose.datos.yml down          (conserva datos)
#   docker compose -f compose/docker-compose.datos.yml down -v       (borra todo)

name: digitalfix-datos

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: digitalfix-oracle
    environment:
      # Contrasena de SYS y SYSTEM. Obligatoria: si no esta definida, el compose falla.
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?falta ORACLE_PASSWORD, copia .env.example a .env}
      # La imagen crea este usuario ademas de los esquemas del init.
      APP_USER: ${ORACLE_APP_USER:-digitalfix}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?falta ORACLE_APP_PASSWORD}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-datos:/opt/oracle/oradata
      # Todo .sql de esta carpeta corre una sola vez, al crear la base.
      - ./init-oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s
    restart: unless-stopped

