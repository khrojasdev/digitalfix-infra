services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: digitalfix-oracle
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=digitalfix
    volumes:
      - ./compose/init-oracle:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 3m

  # --- Cluster de RabbitMQ: dos nodos (rabbitmq1 + rabbitmq2) ---
  rabbitmq1:
    image: rabbitmq:3-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - ./compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq2:
    image: rabbitmq:3-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - ./compose/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  ms-usuarios:
    image: ${DOCKER_USER}/digitalfix-ms-usuarios:latest
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=${DB_URL}
      - ORACLE_USUARIOS_PASSWORD=${ORACLE_USUARIOS_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  ms-catalog:
    image: ${DOCKER_USER}/digitalfix-ms-catalog:latest
    container_name: ms-catalog
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=${DB_URL}
      - ORACLE_CATALOG_PASSWORD=${ORACLE_CATALOG_PASSWORD}
      - SPRING_DATASOURCE_PASSWORD=${ORACLE_CATALOG_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  ms-workorders:
    image: ${DOCKER_USER}/digitalfix-ms-workorders:latest
    container_name: ms-workorders
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=${DB_URL}
      - ORACLE_WORKORDERS_PASSWORD=${ORACLE_WORKORDERS_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  ms-report:
    image: ${DOCKER_USER}/digitalfix-ms-report:latest
    container_name: ms-report
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=${DB_URL}
      - ORACLE_REPORT_PASSWORD=${ORACLE_REPORT_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  ms-audit:
    image: ${DOCKER_USER}/digitalfix-ms-audit:latest
    container_name: ms-audit
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=${DB_URL}
      - ORACLE_AUDIT_PASSWORD=${ORACLE_AUDIT_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq1:
        condition: service_healthy

  ms-notify:
    image: ${DOCKER_USER}/digitalfix-ms-notify:latest
    container_name: ms-notify
    ports:
      - "8084:8084"
    environment:
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq1:
        condition: service_healthy

  ms-rabbitadmin:
    image: ${DOCKER_USER}/digitalfix-ms-rabbitadmin:latest
    container_name: ms-rabbitadmin
    ports:
      - "8087:8087"
    environment:
      - RABBITMQ_HOST=rabbitmq1
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq1:
        condition: service_healthy

  ms-bff:
    image: ${DOCKER_USER}/digitalfix-ms-bff:latest
    container_name: ms-bff
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - USUARIOS_URL=http://ms-usuarios:8081
      - CATALOGO_URL=http://ms-catalog:8082
      - WORKORDERS_URL=http://ms-workorders:8083
      - REPORTES_URL=http://ms-report:8085
      - AUDITORIA_URL=http://ms-audit:8086
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
    depends_on:
      - ms-usuarios
      - ms-catalog
      - ms-workorders
      - ms-report
      - ms-audit
